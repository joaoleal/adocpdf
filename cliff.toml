# Changelog generation, from the commit history that `committed` enforces.
#
# Generated when a release is cut, not on every commit: a changelog regenerated
# per commit conflicts on every merge and nobody reads it. See design.md D6 of
# the shipping-hygiene change.
#
# The template below is git-cliff 2.13.1's own default, adapted. Version note:
# git-cliff's `main` branch template uses `commits | commit_groups(...)` with
# `entry.group`; 2.13.1 does NOT have that filter and needs
# `group_by(attribute="group")`. Copying the newer template against the pinned
# version silently produces an empty changelog.

[changelog]
header = """
# Changelog

Generated from the commit history by [git-cliff](https://git-cliff.org/). Do
not edit by hand — a release regenerates it.

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
render_always = true
postprocessors = [  ]

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
commit_preprocessors = [  ]
protect_breaking_commits = false

# Groups are ordered by the numeric HTML comment, which `striptags` removes
# before rendering. `build` and `ci` are listed explicitly: git-cliff's stock
# parsers cover neither, so without these two lines this project's own history
# — which contains both — would fall through to "Other".
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug fixes" },
    { message = "^refactor", group = "<!-- 2 -->Refactor" },
    { message = "^doc", group = "<!-- 3 -->Documentation" },
    { message = "^perf", group = "<!-- 4 -->Performance" },
    { message = "^style", group = "<!-- 5 -->Styling" },
    { message = "^test", group = "<!-- 6 -->Testing" },
    { message = "^build\\(deps.*\\)", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^chore\\(release\\): prepare for", skip = true },
    { message = "^build", group = "<!-- 7 -->Build system" },
    { message = "^ci", group = "<!-- 8 -->Continuous integration" },
    { message = "^chore", group = "<!-- 9 -->Miscellaneous" },
    { body = ".*security", group = "<!-- 10 -->Security" },
    { message = "^revert", group = "<!-- 11 -->Revert" },
    { message = ".*", group = "<!-- 12 -->Other" },
]

filter_commits = false
fail_on_unmatched_commit = false
link_parsers = [  ]
use_branch_tags = false
tag_pattern = "v[0-9].*"
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false

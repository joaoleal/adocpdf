# Spellchecking for source, comments and documentation.
#
# This codebase carries an unusual amount of prose — the reasoning behind a
# decision lives next to the code implementing it — so a spellchecker earns its
# place here more than it would in a terser project.

[files]
# Vendored text and binary assets are not ours to correct. The DejaVu licence
# in particular must stay byte-for-byte as published.
extend-exclude = [
    "target/",
    "Cargo.lock",
    "LICENSE",
    "crates/adocpdf-typst/assets/",
    "openspec/changes/*/specs/",
    # Tool output, not prose. `cargo mutants` writes build logs here and
    # `libFuzzer` writes raw crash inputs; both are full of compiler flags,
    # crate names and arbitrary bytes that a spellchecker will object to
    # forever and that nobody can correct. Both directories are gitignored.
    "mutants.out/",
    "mutants.out.old/",
    "fuzz/artifacts/",
    "fuzz/corpus/",
    "fuzz/target/",
    # Seeds proptest saved from past failures. The comment lines are ours, but
    # the shrunk counterexamples beside them are arbitrary generated strings.
    "**/proptest-regressions/",
]

[default.extend-words]
# British spellings used deliberately and consistently throughout: "licence"
# the noun, "behaviour", "artefact". `typos` accepts them already, but naming
# them here records that the inconsistency would be the mistake.
licence = "licence"
licences = "licences"
behaviour = "behaviour"
artefact = "artefact"
artefacts = "artefacts"

[default.extend-identifiers]
# Real identifiers that look like typos.
adocpdf = "adocpdf"

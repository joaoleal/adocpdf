[workspace]
resolver = "3"
members = [ "crates/*", "xtask" ]

# `fuzz/` is deliberately not part of this workspace, and the exclusion is
# written down rather than left to the `members` globs happening not to match
# it.
#
# The reason is licensing. `libfuzzer-sys` is `(MIT OR Apache-2.0) AND NCSA` —
# a conjunction, not a choice, so the permissive branch cannot be taken and
# NCSA is not in `deny.toml`'s allow-list. Keeping the fuzz crate out of the
# workspace keeps it out of the lockfile `cargo deny` reads, which is why the
# allow-list does not have to be widened for a tool that never ships.
#
# `cargo fuzz init` does not arrange this: since cargo-fuzz 0.11.4 it no longer
# writes a `[workspace]` table into the generated manifest and it does not
# touch this file. See `fuzz/Cargo.toml`, which carries its own `[workspace]`
# so it resolves independently.
exclude = [ "fuzz" ]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/joaoleal/adocpdf"

[workspace.dependencies]
# Third-party versions are declared once here and inherited by member crates,
# so the architecture guard can check which layer pulls in what.
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
asciidoc-parser = "0.30.0"
clap = { version = "4.6.6", features = [ "derive" ] }
thiserror = "2.0.20"

# Test-only: reads back the PDFs the end-to-end tests produce, so their
# assertions are about the artefact rather than about our own byte buffer.
pdf-extract = "0.12.0"

# Test-only: property-based testing. Used where a rule has to hold for every
# input rather than for the examples someone thought of — the injection
# boundary in `markup::string_literal` and the containment rule in
# `domain::sandbox`. Both are security properties, and an example-based test
# only ever proves the examples.
proptest = "1.11.0"

# Code quality is enforced by analyzers that already exist, configured here,
# rather than by anything hand-written. A lint that is genuinely wrong for this
# codebase is turned off once, below, with a reason — never scattered as
# `#[allow]` attributes where nobody can find them.

[workspace.lints.rust]
# Groups. `priority = -1` lets the individual lints below override them.
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
let_underscore = { level = "warn", priority = -1 }

unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_import_braces = "warn"

[workspace.lints.clippy]
# Groups, weakest first. Later entries win where they overlap.
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# From `restriction`, which is deliberately not adopted wholesale — its lints
# contradict each other by design. These are the ones that catch real mistakes.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
mem_forget = "warn"
exit = "warn"

# --- exceptions, each stated once, with its reason ---------------------------

# The dependency tree holds two versions of several crates because the layout
# engine and the AsciiDoc parser were released against different minors of
# their shared dependencies. Nothing here can fix that, and `cargo-deny`
# already reports duplicates as a warning where they can be reviewed with the
# full graph in view.
multiple_crate_versions = "allow"

# Directly contradicts rustc's `unreachable_pub`, which is enabled above:
# `unreachable_pub` asks for `pub(crate)` on items that cannot be reached from
# outside, and this lint asks for `pub` on those same items when their module
# is private. One of the two has to lose. `unreachable_pub` is kept because it
# states the item's real visibility rather than its syntactic minimum.
redundant_pub_crate = "allow"

# Declaring a function `const` is a promise about future implementations, not a
# local formatting choice: it constrains what the body may ever do, and
# withdrawing it is a breaking change. Almost every hit is a field accessor,
# where the benefit is nil and the commitment is permanent.
missing_const_for_fn = "allow"

# Wants `readme`, `keywords` and `categories` on every crate. Only the binary
# is meant to be published; the library crates carry version numbers so that
# `cargo-deny` sees no wildcards, not because they are destined for crates.io.
# Inventing per-crate READMEs to satisfy a lint would leave real files nobody
# maintains.
cargo_common_metadata = "allow"

[profile.release]
lto = "thin"
# One codegen unit gives the optimiser the whole crate at once. It costs
# release build time, which this project spends rarely.
#
# `lto` stays "thin" deliberately. Fat LTO is the obvious pairing and there is
# no measurement here to justify its extra build time; this project has no
# benchmark suite to produce one. Changing an optimisation setting because it
# sounds stronger, with no number attached, is the thing this repository's
# rules exist to prevent.
codegen-units = 1

# Debug info goes; the symbol table stays.
#
# SECURITY.md states that a panic on untrusted input is a vulnerability, and
# the first artefact of such a report is a backtrace from a user. `strip =
# "symbols"` would buy a little more size and turn every one of those reports
# into a list of hex addresses.
#
# Two things were measured here rather than assumed.
#
# It does not break auditability: `cargo auditable` writes its manifest to a
# linker section, and `cargo audit bin` still reads all 309 dependencies out of
# the binary this produces. If that ever stops holding, auditability wins and
# this line goes.
#
# It also currently saves nothing — 45,335,744 bytes with and without. The
# release profile defaults to `debug = 0`, so there is no debug info to strip.
# The line is kept as a guard: if anyone later turns `debug` on for release,
# the shipped artefact does not silently grow a debug section.
strip = "debuginfo"

# `panic = "abort"` is deliberately absent, for three reasons.
#
# 1. It contradicts a requirement. Malformed source must not be fatal;
#    aborting turns any residual bug on untrusted input into the most fatal
#    outcome available, with no unwinding and no destructor run.
# 2. It would make the tested configuration differ from the shipped one. The
#    test harness needs unwinding, so tests keep `panic = "unwind"` whatever
#    this says. Shipping a panic strategy no test ever exercises is the exact
#    divergence the gate exists to prevent.
# 3. The gain is small — some size and a little speed, against those two costs.

# There is deliberately no [profile.dev.package."*"] opt-level here.
#
# It was tried and measured, not reasoned about. Compiling dependencies at
# opt-level = 2 took a clean `cargo test --workspace` from 29s to 73s, to save
# 0.09s of test execution — the whole suite only spends 0.16s running, the rest
# is compilation. Amortising over warm rebuilds does not rescue it: 0.16s is the
# entire budget the setting could ever recover.
#
# The premise was that an unoptimised layout engine dominates test wall-clock.
# For this suite it does not. Revisit only if tests start doing enough real
# layout work for execution time to become visible.

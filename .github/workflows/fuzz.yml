# Scheduled fuzzing.
#
# Not a gate job, and not runnable by a contributor on the pinned toolchain.
# `cargo-fuzz` needs a nightly compiler because it depends on LLVM sanitizer
# instrumentation, which is unstable; every job in `scripts/ci/gate.sh` runs on
# the pinned stable toolchain and terminates, and fuzzing does neither.
#
# The value comes back to stable through regressions: a crash found here is
# minimised and committed as an ordinary `#[test]`, so a contributor who never
# installs nightly still runs every bug fuzzing has ever found.
#
# One interaction shapes how this job decides. `libfuzzer-sys` installs a panic
# hook that aborts *before* unwinding, so the guard that contains
# `asciidoc-parser`'s panics in the shipped renderer never runs here, and the
# fuzzer still reports those panics as crashes. That is the right outcome — the
# renderer is safe and the upstream defect stays visible — but on its own it
# would make this job fail every week on defects that are already guarded and
# already tested, and a permanently red check is one nobody reads.
#
# So the verdict is not libFuzzer's exit status. `fuzz/known-crashes.toml`
# records each known upstream *defect* — by the location it panics at, not by
# the bytes that reach it, because the set of inputs reaching one defect is
# unbounded — and `scripts/ci/known-crashes.sh` fails on any panic that is not
# recorded, printing the reason for every one it tolerated. The same record is
# read by a test on the pinned stable toolchain, which asserts each entry's
# sample input is still refused by the guard, so an entry cannot outlive the
# defect it names.
#
# `cargo-fuzz` is the one tool in this project with no prebuilt binary from
# `taiki-e/install-action` — checked against its TOOLS.md — so this job
# compiles it. It already runs for minutes, so that is affordable here in a way
# it would not be in the gate.

name: fuzz

on:
  schedule:
    # Sundays, 03:17 UTC. Off the hour deliberately: scheduled workflows queue
    # against everyone else's, and the top of the hour is the worst of it.
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      duration:
        description: Seconds to fuzz each target
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz the parse path
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        target: [parse_plan_emit]

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nightly, not the pinned toolchain in rust-toolchain.toml. This is the
      # only workflow in the project that does not use the pinned channel, and
      # the sanitizer requirement is the whole reason.
      - name: Install a nightly toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustup run nightly rustc --version

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Both values reach the shell as environment variables rather than being
      # expanded into the script text. `${{ }}` inside a `run:` block is
      # substituted before the shell ever sees it, so a value containing shell
      # syntax would become shell syntax — `zizmor`'s template-injection audit
      # flags exactly this. These two are ours, but the safe form costs nothing
      # and does not have to be re-argued when a value stops being ours.
      # A non-zero exit here is not the job's verdict: it is how libFuzzer
      # reports a crash, and the next step decides whether that crash is one
      # already recorded. It is re-raised when no reproducer was written, which
      # is what a build failure or a bad flag looks like — those must not be
      # swallowed.
      - name: Fuzz the target
        env:
          DURATION: ${{ github.event.inputs.duration || '300' }}
          TARGET: ${{ matrix.target }}
        run: |
          set -uo pipefail
          cargo +nightly fuzz run "$TARGET" -- \
            -max_total_time="$DURATION" \
            -print_final_stats=1 2>&1 | tee fuzz-output.log
          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ] && \
             [ -z "$(find fuzz/artifacts -type f -print -quit 2>/dev/null)" ]; then
            echo "the fuzzer failed without producing a reproducer" >&2
            exit "$status"
          fi

      # The job's verdict. Fails on a panic that is not already recorded, and
      # prints the reason for every one it tolerated. The output is read rather
      # than the reproducer, because the panic location is what identifies the
      # defect.
      - name: Classify the panics
        run: scripts/ci/known-crashes.sh fuzz-output.log fuzz/artifacts

      # Only reached when a step above failed, which now means the fuzzer found
      # a crash that is not recorded. The reproducer is what makes the finding
      # actionable, so it is kept rather than left in a deleted runner.
      - name: Upload the crash reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

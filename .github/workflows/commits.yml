# Conventional Commits, enforced on pull requests.
#
# This is deliberately NOT a job in the `gate` workflow, and not a job in
# scripts/ci/gate.sh. The gate checks the WORKING TREE — every one of its
# seventeen jobs makes sense before a commit exists, and it is normally run on
# uncommitted changes. A commit-message linter checks HISTORY, which the gate
# has no view of. Putting it there would mean a job that is meaningless in the
# situation the gate is usually run in.
#
# It is also not a local hook: `--no-verify` exists, and a check the person it
# constrains can skip is documentation, not enforcement. CI is where it holds.
#
# `committed` is the one tool here that `taiki-e/install-action` does not
# carry, checked against its TOOLS.md, so this job compiles it. That is the
# cost of the smaller tool and it is paid in one job.

name: commit convention

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  committed:
    name: conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, not the default single commit: the range below
          # has to reach every commit the pull request contains.
          fetch-depth: 0
          persist-credentials: false

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install committed
        run: cargo install committed --version 1.1.11 --locked

      # HEAD is the merge commit GitHub synthesises for a pull request, so
      # HEAD~ is the base and HEAD^2 is the branch tip. The range is therefore
      # exactly the commits this pull request adds — not just its last one,
      # which is what `committed HEAD` would check.
      - name: Lint the pull request's commit messages
        run: committed HEAD~..HEAD^2 --no-merge-commit
